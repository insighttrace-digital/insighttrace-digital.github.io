<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>InsightTrace Digital | Auditoria e Segurança</title>

<style>

/* ================= RESET ================= */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(135deg,#0a1f44,#0f2e6d);
  color:#ffffff;
}

/* ================= HEADER ================= */

header{
  text-align:center;
  padding:40px 20px;
}

.logo{
  font-size:2.4rem;
  font-weight:bold;
  background: linear-gradient(90deg,#00c6ff,#0072ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* ================= CONTEUDO ================= */

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

/* ================= BANNER ROTATIVO (NOVO CSS) ================= */

.banner-rotativo{
  max-width:900px;
  height:130px;
  margin:60px auto;
  padding:20px;
  border-radius:14px;
  background:#ffffff;
  box-shadow:0 10px 25px rgba(0,0,0,0.15);
  text-align:center;
  font-weight:600;
  font-size:1.1rem;
  cursor:pointer;
  transition:0.3s;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#0a1f44;
}

.banner-rotativo:hover{
  transform:scale(1.02);
}

/* ================= WHATSAPP ================= */

.whatsapp-fixo{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25d366;
  width:60px;
  height:60px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 5px 15px rgba(0,0,0,0.3);
  z-index:999;
}

.whatsapp-fixo img{
  width:32px;
}

/* ================= RESPONSIVO ================= */

@media(max-width:768px){

  .logo{
    font-size:2rem;
  }

  .banner-rotativo{
    max-width:95%;
    height:115px;
    font-size:1rem;
  }

}

</style>
</head>

<body>

<header>
  <div class="logo">InsightTrace Digital</div>
</header>

<div class="container">

  <!-- ================= BANNER 1 ================= -->

  <div class="banner-rotativo" id="banner1">
    🔐 Proteja sua empresa contra golpes digitais – Anuncie Aqui
  </div>

  <!-- ================= BANNER 2 ================= -->

  <div class="banner-rotativo" id="banner2">
    📢 Espaço publicitário disponível – Público segmentado e qualificado
  </div>

</div>

<!-- ================= WHATSAPP ================= -->

<a href="https://wa.me/5599999999999" target="_blank" class="whatsapp-fixo">
  <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" alt="WhatsApp">
</a>

<!-- ================= SCRIPT NOVO ================= -->

<script>

const banners = [
  "🔐 Proteja sua empresa contra golpes digitais – Anuncie Aqui",
  "📢 Público qualificado em segurança digital",
  "⚖️ Escritórios de advocacia podem anunciar aqui",
  "🛡️ Empresas de monitoramento e antifraude",
  "💼 Plano Bronze R$150 | Plano Prata R$250 | Plano Ouro R$400"
];

let index = 0;

function rotacionarBanner(){
  const banner1 = document.getElementById("banner1");
  const banner2 = document.getElementById("banner2");

  banner1.innerText = banners[index];
  banner2.innerText = banners[(index + 1) % banners.length];

  index = (index + 1) % banners.length;
}

setInterval(rotacionarBanner, 4000);

</script>

</body>
</html>
